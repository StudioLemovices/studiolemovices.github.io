<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Lemovices — Liens</title>
<meta name="description" content="Studio Lemovices. Mobilier sur mesure en bois massif, entre Bruxelles et Lyon. Le site, Instagram, le contact.">
<meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1D1B" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://studiolemovices.github.io/liens/">
<link rel="icon" href="../logo/logo-noir.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="../logo/logo-blanc.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studio Lemovices">
<meta property="og:title" content="Studio Lemovices">
<meta property="og:description" content="Ici pousse un atelier. A workshop grows here.">
<meta property="og:url" content="https://studiolemovices.github.io/liens/">
<meta property="og:image" content="https://studiolemovices.github.io/pieces/table-quercus-aguacate/01-ensemble.jpg">
<link rel="preload" href="../fonts/cormorant-garamond-latin-wght-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/work-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Page de liens du QR code (stickers, flyers). Autonome : ne dépend pas de style.css. */
@font-face {
  font-family: "Cormorant Garamond";
  src: url("../fonts/cormorant-garamond-latin-wght-normal.woff2") format("woff2");
  font-weight: 300 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Cormorant Garamond";
  src: url("../fonts/cormorant-garamond-latin-wght-italic.woff2") format("woff2");
  font-weight: 300 700; font-style: italic; font-display: swap;
}
@font-face {
  font-family: "Work Sans";
  src: url("../fonts/work-sans-latin-wght-normal.woff2") format("woff2");
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {
  --ink: #1C1B19;
  --paper: #F6F3EE;
  --muted: #706b64;
  --line: #e2ddd5;
  --serif: "Cormorant Garamond", "Times New Roman", serif;
  --sans: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #EDE6DA;
    --paper: #1E1D1B;
    --muted: #a29b8f;
    --line: #34312d;
  }
  .logo.logo-noir { display: none; }
  .logo.logo-blanc { display: block; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  display: flex;
  justify-content: center;
  padding: max(48px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
}
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; text-align: center; }

.logo { width: 128px; height: 128px; display: block; }
.logo-blanc { display: none; }

h1 {
  margin: 28px 0 0;
  font: italic 500 clamp(34px, 9vw, 42px)/1.1 var(--serif);
  letter-spacing: .005em;
}
.en { margin: 6px 0 0; font: italic 400 21px/1.3 var(--serif); color: var(--muted); }
.studio { margin: 22px 0 0; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; }
.lieux { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

nav { width: 100%; margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }
nav a {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 22px;
  border: 1px solid var(--ink);
  color: var(--ink);
  text-decoration: none;
  transition: background .25s var(--ease), color .25s var(--ease);
}
nav a:hover, nav a:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
nav a:hover .tr, nav a:focus-visible .tr { color: inherit; opacity: .7; }
.lbl { font: 500 22px/1.2 var(--serif); }
.tr { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

footer { margin-top: 44px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
</style>
</head>
<body>
<main>
  <img class="logo logo-noir" src="../logo/logo-noir.svg" alt="Studio Lemovices" width="128" height="128">
  <img class="logo logo-blanc" src="../logo/logo-blanc.svg" alt="" width="128" height="128" aria-hidden="true">

  <h1>Ici pousse un atelier.</h1>
  <p class="en" lang="en">A workshop grows here.</p>
  <p class="studio">Studio Lemovices</p>
  <p class="lieux">Mobilier en bois massif · <span lang="en">Solid wood furniture</span></p>

  <nav aria-label="Liens">
    <a href="../"><span class="lbl">Le site</span><span class="tr" lang="en">Website</span></a>
    <a href="https://www.instagram.com/studiolemovices/" rel="me noopener"><span class="lbl">Instagram</span><span class="tr">@studiolemovices</span></a>
    <a href="../#contact"><span class="lbl">Écrire au studio</span><span class="tr" lang="en">Contact</span></a>
    <!-- Etsy, à ajouter le jour où la boutique ouvre :
    <a href="https://www.etsy.com/shop/…" rel="noopener"><span class="lbl">La boutique</span><span class="tr" lang="en">Shop · Etsy</span></a>
    -->
  </nav>

  <footer>🇧🇪 Bruxelles / Lyon 🇫🇷</footer>
</main>
</body>
</html>
